[project]
name = "uvl-client"
version = "0.1.0"
description = "Python client for the UVL REST API"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marco Baldanza" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uvl_client"]

          readOnly: true
        hardware_capabilities:
          readOnly: true
        default_config:
          readOnly: true
        schema_version:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - default_config
      - device_family
      - hardware_capabilities
      - id
      - model_code
      - model_display
      - schema_version
      - updated_at
    FirmwareBlob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        filename:
          type: string
          maxLength: 255
        sha256:
          type: string
          maxLength: 64
        size_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        model_codes: {}
        version:
          type: string
          maxLength: 64
        state:
          allOf:
          - $ref: '#/components/schemas/FirmwareBlobStateEnum'
          readOnly: true
        ingest_error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - filename
      - id
      - ingest_error
      - sha256
      - size_bytes
      - state
      - updated_at
    FirmwareBlobStateEnum:
      enum:
      - uploaded
      - ingesting
      - ready
      - failed
      type: string
      description: |-
        * `uploaded` - Uploaded
        * `ingesting` - Ingesting
        * `ready` - Ready
        * `failed` - Failed
    Fleet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        blueprint:
          type: string
          format: uuid
          nullable: true
        controller_target:
          type: string
          format: uuid
        state:
          allOf:
          - $ref: '#/components/schemas/FleetStateEnum'
          readOnly: true
        device_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        ramp_spec: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - controller_target
      - created_at
      - id
      - name
      - state
      - updated_at
    FleetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        blueprint:
          type: string
          format: uuid
          nullable: true
        controller_target:
          type: string
          format: uuid
        device_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        ramp_spec: {}
      required:
      - controller_target
      - name
    FleetStateEnum:
      enum:
      - creating
      - ramping
      - active
      - paused
      - tearing_down
      - deleted
      type: string
      description: |-
        * `creating` - Creating
        * `ramping` - Ramping
        * `active` - Active
        * `paused` - Paused
        * `tearing_down` - Tearing down
        * `deleted` - Deleted
    FlowRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device:
          type: string
          format: uuid
          readOnly: true
        protocol:
          allOf:
          - $ref: '#/components/schemas/ProtocolEnum'
          readOnly: true
        src_ip:
          type: string
          readOnly: true
        dst_ip:
          type: string
          readOnly: true
        src_port:
          type: integer
          readOnly: true
          nullable: true
        dst_port:
          type: integer
          readOnly: true
          nullable: true
        bytes_tx:
          type: integer
          readOnly: true
        bytes_rx:
          type: integer
          readOnly: true
        application:
          type: string
          readOnly: true
        blocked:
          type: boolean
          readOnly: true
        reported_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - blocked
      - bytes_rx
      - bytes_tx
      - created_at
      - device
      - dst_ip
      - dst_port
      - id
      - protocol
      - reported_at
      - src_ip
      - src_port
    HealthEnum:

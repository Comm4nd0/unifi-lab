  /api/v1/devices/:
    get:
      operationId: v1_devices_list
      parameters:
      - in: query
        name: controller_target
        schema:
          type: string
          format: uuid
      - in: query
        name: fleet
        schema:
          type: string
          format: uuid
      - in: query
        name: model_code
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
          enum:
          - adopted
          - config_apply
          - disconnected
          - error
          - heartbeat
          - key_exchange
          - pending
        description: |-
          * `pending` - Pending
          * `key_exchange` - Key exchange
          * `heartbeat` - Heartbeat
          * `config_apply` - Config apply
          * `adopted` - Adopted
          * `disconnected` - Disconnected
          * `error` - Error
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:

components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    ActivationRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        scopes: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_used_at
      - name
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        diff:
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - diff
      - id
      - metadata
      - target_id
      - target_type
    Blueprint:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        source_yaml:
          type: string
        parsed_json:
          readOnly: true
        version:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - parsed_json
      - source_yaml
      - updated_at
      - version
    BlueprintRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        source_yaml:
          type: string
          minLength: 1
        is_active:
          type: boolean
      required:
      - name
      - source_yaml
    ControllerTarget:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        kind:
          $ref: '#/components/schemas/KindEnum'
        inform_url:
          type: string
        api_url:
          type: string
        verify_tls:
          type: boolean
        is_active:
          type: boolean
        health:
          allOf:
          - $ref: '#/components/schemas/HealthEnum'
          readOnly: true
        last_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - api_url
      - created_at
      - health
      - id
      - inform_url
      - last_verified_at
      - name
      - updated_at
    ControllerTargetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          $ref: '#/components/schemas/KindEnum'
        inform_url:
          type: string
          minLength: 1
        api_url:
          type: string
          minLength: 1
        api_username:
          type: string
          writeOnly: true
          minLength: 1
        api_password:
          type: string
          writeOnly: true
          minLength: 1
        verify_tls:
          type: boolean
        is_active:
          type: boolean
      required:
      - api_password
      - api_url
      - api_username
      - inform_url
      - name
    DeviceFamilyEnum:
      enum:
      - ap
      - switch
      - gateway
      - other
      type: string
      description: |-
        * `ap` - Access point
        * `switch` - Switch
        * `gateway` - Gateway
        * `other` - Other
    DeviceTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        model_code:
          type: string
          readOnly: true
        model_display:
          type: string
          readOnly: true
        device_family:

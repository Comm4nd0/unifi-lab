[project]
name = "uvl-backend"
version = "0.1.0"
description = "UniFi Virtual Lab — Django backend and asyncio device engine"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marco Baldanza" }]

dependencies = [
    # Django core
    "django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "django-filter>=24.0",
    "drf-spectacular>=0.27",
    "djoser>=2.2",

    # Async + WebSocket
    "channels[daphne]>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",

    # Database
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.2",
    # Async ORM for the engine worker
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",

    # Background jobs
    "celery[redis]>=5.4",
    "redis>=5.0",

    # HTTP
    "httpx>=0.27",

    # Crypto
    "cryptography>=42.0",

    # Config / validation
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.22",

    # Observability
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "types-pyyaml>=6.0",
    "ipython>=8.0",
    "django-extensions>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["apps", "engine", "config"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["build", ".venv", "**/migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["channels.*", "celery.*", "drf_spectacular.*", "djoser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["apps", "engine"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
